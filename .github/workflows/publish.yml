name: Test and publish

# Every push and pull request is type-checked, tested and built. A push to main publishes the
# version in package.json to npm when that version is not on npm yet: bump the version to release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (no token needed) and provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish if the version is new
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          # Only needed without trusted publishing: an npm automation token as repository secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install --global npm@latest
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; nothing to publish."
          else
            npm publish --provenance --access public
          fi
